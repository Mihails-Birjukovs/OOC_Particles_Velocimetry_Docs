<title id="title">OOC v5.2 particle analysis processing stages</title>
<desc id="desc">Six boxes connected by arrows show raw TIFF import, crop and diagnostic projections, enhancement, histogram matching, artifact suppression and segmentation, then centroid extraction and metadata export.</desc>
