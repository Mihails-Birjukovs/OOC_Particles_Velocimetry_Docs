name: Build and publish documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/validate_public_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build public site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Zensical
        run: python -m pip install zensical
      - name: Audit public documentation allowlist
        run: python scripts/validate_public_docs.py
      - name: Build in strict mode
        run: zensical build --clean --strict
      - name: Upload reviewed site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ooc-public-website
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ooc-public-website
          path: site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
